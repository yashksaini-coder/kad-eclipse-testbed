[package]
name = "kad-eclipse-testbed"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Empirical eclipse-attack testbed for rust-libp2p Kademlia"
repository = "https://github.com/yashksaini-coder/kad-eclipse-testbed"

# Not published to crates.io yet, deliberately. The artifact worth publishing is
# the measurement, and the measurement does not exist until testbed::run does.
# Flip this once there are numbers in docs/results/. Squatting the name earlier
# just creates an abandoned crate.
publish = false
keywords = ["libp2p", "kademlia", "dht", "eclipse", "sybil"]
categories = ["network-programming"]

[dependencies]
# libp2p 0.57.0 resolves libp2p-identity 0.3.0 (transitively, via libp2p-core).
#
# DO NOT add `libp2p-identity` as a direct dependency at a DIFFERENT major than
# the facade resolves — e.g. an old `= "0.2"` alongside 0.57's 0.3.x. Cargo will
# happily build BOTH, and you get two distinct `PeerId` types with identical
# names, whose errors read like nonsense ("expected PeerId, found PeerId"). Use
# the `libp2p::identity` re-export instead — see src/attack.rs — and it tracks
# whatever the facade pins across bumps for free.
libp2p = { version = "0.57", default-features = false, features = [
    "kad",
    "tcp",
    "noise",
    "yamux",
    "identify",
    "macros",
    "tokio",
] }

futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }

ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# NOTE: no `rand` dependency. `libp2p::identity::Keypair::generate_ed25519()`
# seeds itself; pulling in our own `rand` risks a second copy of rand_core at a
# different major version, which is the same class of problem as the identity
# pin above. If a seeded/reproducible generator is needed later, take the rand
# version from `cargo tree -i rand` rather than picking the latest.

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[[bin]]
name = "kad-eclipse-testbed"
path = "src/main.rs"

[profile.release]
debug = 1 # keep symbols: the ID grinder is the hot loop worth profiling
